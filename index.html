<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>租屋管家 Pro - V39.4 完美修復版</title>
    
    <!-- PWA Settings -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f3f4f6">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        :root { --base-font-size: 16px; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: #f3f4f6;
            color: #1f2937; 
            font-size: var(--base-font-size); 
            -webkit-tap-highlight-color: transparent; 
            padding-top: env(safe-area-inset-top);
            padding-bottom: 100px;
        }

        .card { 
            background: white; 
            border-radius: 20px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid rgba(0,0,0,0.05);
            overflow: hidden; 
            transition: transform 0.2s ease; 
        }
        .card:active { transform: scale(0.99); }

        /* === 蘋果風輸入框 === */
        .input-label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #6b7280;
            margin-bottom: 0.25rem;
            display: block;
            margin-left: 0.25rem;
        }
        
        .input-field { 
            width: 100%; 
            padding: 14px 16px; 
            font-size: 16px; 
            font-weight: 500; 
            color: #111827; 
            background-color: #f3f4f6; /* 預設灰底 */
            border: 1px solid transparent; 
            border-radius: 12px; 
            outline: none; 
            transition: all 0.2s ease;
            -webkit-appearance: none;
        }
        .input-field:focus { 
            background-color: #ffffff; /* 聚焦白底 */
            border-color: #6366f1; 
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15); 
        }
        .input-field::placeholder { color: #9ca3af; }
        
        /* 數字輸入框特別樣式 */
        .input-number {
            font-family: 'Courier New', Courier, monospace;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .btn { display: flex; align-items: center; justify-content: center; padding: 14px; font-size: 1rem; font-weight: 600; border-radius: 14px; transition: all 0.2s; cursor: pointer; border: none; }
        .btn:active { transform: scale(0.96); opacity: 0.9; }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; background: #e5e7eb; color: #9ca3af; box-shadow: none; }
        
        .btn-primary { background: #4f46e5; color: white; box-shadow: 0 4px 10px rgba(79, 70, 229, 0.3); }
        .btn-success { background: #10b981; color: white; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3); }
        .btn-danger { background: #fee2e2; color: #ef4444; }
        .btn-outline { background: white; color: #4f46e5; border: 1px solid #e0e7ff; }

        .floating-nav {
            position: fixed; bottom: 20px; left: 16px; right: 16px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 20px;
            padding: 8px;
            display: flex; justify-content: space-around;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255,255,255,0.5);
            z-index: 50;
            max-width: 500px;
            margin: 0 auto;
        }
        .nav-btn { color: #9ca3af; transition: all 0.2s; padding: 10px; border-radius: 12px; }
        .nav-btn.active { color: #4f46e5; background: #eef2ff; }

        .hidden { display: none !important; }
        .modal { background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px); z-index: 1000; }
        
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .photo-scroller { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 8px 0; scroll-snap-type: x mandatory; }
        .photo-item { width: 80px; height: 80px; flex-shrink: 0; border-radius: 12px; overflow: hidden; position: relative; background: #f3f4f6; }
        .photo-item img { width: 100%; height: 100%; object-fit: cover; }
        .photo-del { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,0.6); color: white; width: 20px; height: 20px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; }

        .pie-chart { width: 160px; height: 160px; border-radius: 50%; position: relative; margin: 0 auto; background: #e5e7eb; }
        .pie-chart::after { content: ""; position: absolute; inset: 25px; background: white; border-radius: 50%; }
    </style>
</head>
<body class="antialiased">

    <!-- 0. Landing Page -->
    <div id="view-landing" class="view-section min-h-screen flex flex-col items-center justify-center p-8 bg-white text-slate-800">
        <div class="z-10 text-center animate-slide-up w-full max-w-sm">
            <div class="mb-6 inline-flex p-6 bg-indigo-50 rounded-[32px] text-indigo-600">
                <i class="fa-solid fa-building-user text-6xl"></i>
            </div>
            <h1 class="text-3xl font-extrabold mb-2">租屋管家 Pro</h1>
            <p class="text-slate-400 mb-10 font-medium">智慧資產管理 V39.4</p>
            <div class="space-y-4 w-full">
                <button onclick="window.switchView('owner-login')" class="w-full btn btn-primary py-4 text-lg shadow-lg shadow-indigo-200">房東登入</button>
                <button onclick="window.switchView('tenant-login')" class="w-full btn bg-white border border-slate-200 text-slate-600 py-4 text-lg">房客查詢</button>
            </div>
            <p class="mt-12 text-xs text-slate-300 font-mono tracking-widest uppercase">Project: <span id="landing-id">---</span></p>
        </div>
    </div>

    <!-- 1. Login Pages -->
    <div id="view-owner-login" class="view-section hidden min-h-screen bg-white flex flex-col items-center justify-center p-8">
        <div class="w-full max-w-sm">
            <button onclick="window.switchView('landing')" class="mb-8 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-arrow-left mr-1"></i>返回</button>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">房東驗證</h2>
            <p class="text-slate-400 mb-6 text-sm">請輸入管理密碼</p>
            <input type="password" id="owner-pwd-input" class="input-field text-center text-3xl tracking-[0.5em] mb-4 h-16" placeholder="••••" maxlength="8">
            <p id="owner-login-error" class="text-red-500 text-center font-bold mb-6 text-sm hidden"></p>
            <button onclick="window.verifyOwner()" class="btn btn-primary w-full py-4 text-lg shadow-lg">進入系統</button>
        </div>
    </div>
    <div id="view-tenant-login" class="view-section hidden min-h-screen bg-white flex flex-col items-center justify-center p-8">
        <div class="w-full max-w-sm">
            <button onclick="window.switchView('landing')" class="mb-8 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-arrow-left mr-1"></i>返回</button>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">房客查詢</h2>
            <p class="text-slate-400 mb-6 text-sm">請輸入手機號碼</p>
            <input type="tel" id="tenant-phone-input" class="input-field text-center text-2xl mb-4 h-16" placeholder="09xxxxxxxx">
            <p id="tenant-login-error" class="text-red-500 text-center font-bold mb-6 text-sm hidden"></p>
            <button onclick="window.tenantLogin()" class="btn btn-primary w-full py-4 text-lg shadow-lg">查詢</button>
        </div>
    </div>

    <!-- 2. Landlord App -->
    <div id="app-landlord" class="view-section hidden min-h-screen">
        <header class="bg-white/90 backdrop-blur-md text-slate-800 px-5 py-4 sticky top-0 z-30 flex justify-between items-center border-b border-slate-100">
            <div class="flex items-center cursor-pointer" onclick="window.confirmExit()">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white mr-2">
                    <i class="fa-solid fa-building"></i>
                </div>
                <h1 class="text-lg font-bold">租屋管家</h1>
            </div>
            <div id="status-indicator" class="text-[10px] font-bold bg-slate-100 text-slate-400 px-3 py-1 rounded-full cursor-pointer" onclick="window.initCloud()">連線中...</div>
        </header>

        <main class="container mx-auto p-4 max-w-lg">
            <!-- DASHBOARD -->
            <div id="tab-dashboard" class="landlord-tab animate-slide-up">
                <div class="card p-5 mb-5 bg-gradient-to-br from-indigo-600 to-blue-700 text-white shadow-lg shadow-indigo-200 border-none">
                    <div class="text-indigo-200 text-xs font-bold mb-1">本月淨利預估</div>
                    <div class="text-4xl font-black mb-5 tracking-tight" id="dash-net">$0</div>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-white/10 rounded-xl p-3 border border-white/10"><div class="text-indigo-100 text-[10px] mb-1">已收租金</div><div class="text-lg font-bold" id="dash-income">$0</div></div>
                        <div class="bg-white/10 rounded-xl p-3 border border-white/10"><div class="text-pink-200 text-[10px] mb-1">待收總額</div><div class="text-lg font-bold text-pink-100" id="dash-pending">$0</div></div>
                        <div class="bg-white/10 rounded-xl p-3 border border-white/10"><div class="text-yellow-200 text-[10px] mb-1">⚡ 電費利潤</div><div class="text-lg font-bold" id="dash-elec-profit">$0</div></div>
                        <div class="bg-white/10 rounded-xl p-3 border border-white/10"><div class="text-orange-200 text-[10px] mb-1">🔧 修繕支出</div><div class="text-lg font-bold" id="dash-repair-cost">$0</div></div>
                    </div>
                </div>
                
                <div id="dashboard-meter-container" class="hidden mb-5">
                    <h3 class="text-sm font-bold text-slate-500 mb-2 ml-1">待辦事項</h3>
                    <div id="dashboard-meter-list" class="space-y-2"></div>
                </div>

                <div id="dashboard-repairs-container" class="hidden mb-5"><div id="dashboard-repairs-list" class="space-y-2"></div></div>
                
                <h3 class="text-sm font-bold text-slate-500 mb-2 ml-1">待收款項</h3>
                <div id="dashboard-bills-list" class="space-y-3 pb-20"></div>
            </div>

            <!-- ROOMS -->
            <div id="tab-rooms" class="landlord-tab hidden animate-slide-up">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold text-slate-800">房間管理</h2>
                    <button onclick="window.openRoomModal()" class="btn btn-primary text-sm px-4 py-2 shadow-md">+ 新增</button>
                </div>
                <div id="rooms-list" class="space-y-3 pb-20"></div>
            </div>

            <!-- FINANCE -->
            <div id="tab-finance" class="landlord-tab hidden animate-slide-up">
                <h2 class="text-2xl font-bold text-slate-800 mb-4">財務報表</h2>
                <div id="yearly-summary-container" class="mb-6"></div>
                <h3 class="text-sm font-bold text-slate-500 mb-2 ml-1">月度明細</h3>
                <div id="finance-list" class="space-y-3 pb-20"></div>
                <div id="empty-finance-msg" class="hidden text-center py-10 text-slate-300 font-bold">尚無數據</div>
            </div>

            <!-- SETTINGS -->
            <div id="tab-settings" class="landlord-tab hidden animate-slide-up">
                <h2 class="text-2xl font-bold text-slate-800 mb-4">系統設定</h2>
                
                <div class="card p-5 mb-5 space-y-4">
                    <h3 class="font-bold text-slate-800 text-sm border-b pb-2">新房間預設費率</h3>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="input-label">房客電費 (固定)</label><input type="number" id="set-elec" class="input-field bg-slate-100 text-slate-500" value="3.5" disabled></div>
                        <div><label class="input-label">台電成本 (可變)</label><input type="number" id="set-elec-cost" class="input-field" onchange="window.saveSettings()"></div>
                        <!-- Water hidden -->
                        <input type="hidden" id="set-water" value="0">
                        <div><label class="input-label">水費成本 (總額)</label><input type="number" id="set-water-cost" class="input-field" onchange="window.saveSettings()"></div>
                        <div><label class="input-label">字體大小</label>
                            <div class="flex gap-1">
                                <button onclick="window.setFontSize(16)" class="flex-1 py-2 bg-slate-100 rounded text-xs">小</button>
                                <button onclick="window.setFontSize(18)" class="flex-1 py-2 bg-slate-100 rounded text-xs">中</button>
                            </div>
                        </div>
                    </div>
                    <div><label class="input-label">房東密碼</label><input type="text" id="set-pwd" class="input-field" onchange="window.saveSettings()"></div>
                    <div><label class="input-label">匯款帳號</label><input type="text" id="set-bank" class="input-field" onchange="window.saveSettings()"></div>
                </div>

                <div class="card p-5 mb-5 border border-indigo-100 bg-indigo-50/50">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-bold text-slate-500">專案 ID: <span id="set-project-id" class="text-indigo-600 font-mono">---</span></span>
                        <span id="auth-status" class="text-[10px] bg-white px-2 py-1 rounded border">未驗證</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="window.forceUploadAllLocalData()" class="btn bg-white text-indigo-600 text-xs py-2 border border-indigo-200">強制上傳</button>
                        <button onclick="window.forceDownloadCloudData()" class="btn bg-white text-indigo-600 text-xs py-2 border border-indigo-200">強制下載</button>
                    </div>
                </div>
            </div>
        </main>

        <nav class="floating-nav">
            <button onclick="window.switchTab('dashboard')" class="nav-btn active" id="btn-dashboard"><i class="fa-solid fa-chart-pie text-xl"></i></button>
            <button onclick="window.switchTab('rooms')" class="nav-btn" id="btn-rooms"><i class="fa-solid fa-door-open text-xl"></i></button>
            <button onclick="window.switchTab('finance')" class="nav-btn" id="btn-finance"><i class="fa-solid fa-file-invoice-dollar text-xl"></i></button>
            <button onclick="window.switchTab('settings')" class="nav-btn" id="btn-settings"><i class="fa-solid fa-gear text-xl"></i></button>
        </nav>
    </div>

    <!-- Modals -->
    <!-- 抄表計費 (V39.3 Logic) -->
    <div id="modal-bill" class="modal fixed inset-0 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-[32px] p-6 animate-slide-up shadow-2xl flex flex-col max-h-[90vh]">
            <h3 class="text-xl font-bold mb-4 text-slate-800 text-center">抄表計費</h3>
            <div class="space-y-4 overflow-y-auto">
                <input type="hidden" id="bill-room-id">
                
                <div class="flex justify-between items-center bg-slate-50 p-3 rounded-xl">
                    <span class="text-xs text-slate-400 font-bold">上期度數</span>
                    <span id="bill-last" class="text-xl font-bold text-slate-700">0</span>
                </div>

                <div><label class="input-label">帳單月份</label><input id="bill-month" type="month" class="input-field"></div>
                
                <div class="relative">
                    <input id="bill-curr" type="number" class="input-field text-center text-4xl h-24 font-bold text-indigo-600 bg-indigo-50 border-indigo-200" placeholder="本期">
                    <span class="absolute right-4 top-1/2 -translate-y-1/2 text-indigo-300 font-bold">度</span>
                </div>

                <!-- 費率設定 -->
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                    <div class="text-xs font-bold text-slate-400 border-b pb-1">本月費率與成本</div>
                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="input-label">房客電價</label><input id="bill-elec-rate" type="number" class="input-field bg-white text-sm" value="3.5" disabled></div>
                        <div><label class="input-label text-indigo-600">台電成本/度</label><input id="bill-elec-cost-rate" type="number" step="0.1" class="input-field bg-white text-sm border-indigo-200"></div>
                        <div class="col-span-2"><label class="input-label text-indigo-600">本月水費總成本 (房東付)</label><input id="bill-water-cost" type="number" class="input-field bg-white text-sm border-indigo-200"></div>
                        <!-- Hidden fields -->
                        <input type="hidden" id="bill-water-fee" value="0">
                    </div>
                </div>

                <div><label class="input-label">管理費</label><input id="bill-mgmt" type="number" class="input-field"></div>
            </div>
            <div class="flex gap-3 mt-6">
                <button onclick="window.closeModal('modal-bill')" class="btn btn-outline flex-1">取消</button>
                <button onclick="window.createBill()" class="btn btn-primary flex-1 shadow-lg">生成</button>
            </div>
        </div>
    </div>
    
    <!-- 財務詳情 Modal (圓餅圖修復) -->
    <div id="modal-finance-detail" class="modal fixed inset-0 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[32px] shadow-2xl overflow-hidden animate-slide-up flex flex-col max-h-[90vh]">
            <div class="bg-slate-800 p-5 text-white flex justify-between items-center">
                <h3 class="text-xl font-bold" id="fin-detail-month">---</h3>
                <button onclick="window.closeModal('modal-finance-detail')" class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-6">
                <div class="flex flex-col items-center">
                    <div id="pie-chart" class="pie-chart mb-4"></div>
                    <div class="flex gap-3 text-xs font-bold text-slate-500">
                        <div class="flex items-center"><div class="w-2 h-2 rounded-full bg-green-500 mr-1"></div>淨利</div>
                        <div class="flex items-center"><div class="w-2 h-2 rounded-full bg-blue-500 mr-1"></div>水電</div>
                        <div class="flex items-center"><div class="w-2 h-2 rounded-full bg-orange-500 mr-1"></div>修繕</div>
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2 text-center bg-slate-50 p-4 rounded-xl">
                    <div><div class="text-[10px] text-slate-400 mb-1">總收</div><div id="fin-detail-income" class="font-bold text-slate-800">$0</div></div>
                    <div><div class="text-[10px] text-red-400 mb-1">總支</div><div id="fin-detail-cost" class="font-bold text-red-500">$0</div></div>
                    <div><div class="text-[10px] text-green-500 mb-1">淨賺</div><div id="fin-detail-net" class="font-bold text-green-600">$0</div></div>
                </div>
                <div id="fin-detail-list" class="space-y-2"></div>
            </div>
        </div>
    </div>

    <!-- 補回其他必要的 Modals 以防報錯 -->
    <div id="modal-room-detail" class="modal fixed inset-0 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[32px] overflow-hidden animate-slide-up">
            <div class="h-48 bg-slate-200 relative"><img id="detail-photo" class="w-full h-full object-cover"><button onclick="window.closeModal('modal-room-detail')" class="absolute top-4 right-4 w-8 h-8 bg-black/30 rounded-full text-white flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button><div class="absolute bottom-4 left-4 text-white"><h3 id="detail-room-title" class="text-2xl font-bold">--</h3><p id="detail-tenant" class="text-sm opacity-90">--</p></div></div>
            <div class="p-5 space-y-4">
                <div class="grid grid-cols-3 gap-2 text-center text-sm"><div class="bg-slate-50 p-2 rounded"><div>月租</div><div id="detail-rent" class="font-bold">--</div></div><div class="bg-slate-50 p-2 rounded"><div>水費</div><div id="detail-water">--</div></div><div class="bg-slate-50 p-2 rounded"><div>管理費</div><div id="detail-mgmt">--</div></div></div>
                <div class="text-xs text-slate-400 text-center"><span id="detail-start"></span> ~ <span id="detail-end"></span></div>
                <div class="space-y-2">
                    <div class="text-xs font-bold text-slate-400">家具/合約照片</div>
                    <div id="detail-furn-list" class="photo-scroller"></div>
                    <div id="detail-cont-list" class="photo-scroller"></div>
                </div>
            </div>
            <div class="p-4 border-t flex gap-3"><button onclick="window.openEditRoom()" class="flex-1 btn btn-outline">編輯</button><button onclick="window.openBillFromDetail()" class="flex-1 btn btn-primary">抄表</button></div>
        </div>
    </div>

    <div id="modal-room-edit" class="modal fixed inset-0 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[32px] p-5 animate-slide-up flex flex-col max-h-[90vh]">
            <h3 id="edit-modal-title" class="text-xl font-bold mb-4">編輯房間</h3>
            <div class="overflow-y-auto space-y-4 flex-1">
                <input type="hidden" id="edit-room-id">
                <div><label class="input-label">房號</label><input id="edit-name" class="input-field"></div>
                <div><label class="input-label">月租</label><input id="edit-rent" type="number" class="input-field"></div>
                
                <div class="bg-slate-50 p-3 rounded-xl space-y-3">
                     <input id="edit-tenant" class="input-field" placeholder="房客姓名">
                     <input id="edit-phone" class="input-field" placeholder="電話">
                     <div class="grid grid-cols-2 gap-2">
                         <input id="edit-start" type="date" class="input-field">
                         <input id="edit-end" type="date" class="input-field">
                     </div>

        window.renderRooms = function() { 
            const c=document.getElementById('rooms-list'); if(!c)return; 
            c.innerHTML=window.state.rooms.map(r=>{

                const safeId = String(r.id).replace(/'/g, "\\'");

            }).join(''); 
        };

        window.renderDashboard = function() {
            const income = window.state.records.filter(r => r.paid).reduce((s, r) => s + (Number(r.total) || 0), 0);
            const pending = window.state.records.filter(r => !r.paid).reduce((s, r) => s + (Number(r.total) || 0), 0);
            const repairCost = window.state.repairs.reduce((s, r) => s + (Number(r.cost) || 0), 0);
            
            // Calculate Profit
            let totalProfit = 0;
            let totalElecProfit = 0;
            let totalWaterProfit = 0; 

            window.state.records.filter(r => r.paid).forEach(r => {
                 const eCostRate = r.elecCostRate !== undefined ? r.elecCostRate : (window.state.settings.elecCostRate || 2.1);
                 const wCost = r.waterCost !== undefined ? r.waterCost : (window.state.settings.waterCostRate || 50);
                 const eRev = r.elecCost || 0; 
                 const eCost = (r.usage || 0) * eCostRate; 
                 const wRev = r.waterFee || 0; 
                 totalElecProfit += (eRev - eCost);
                 totalWaterProfit += (wRev - wCost);
                 totalProfit += (r.total - eCost - wCost);
            });
            const net = totalProfit - repairCost;

            if(document.getElementById('dash-income')) document.getElementById('dash-income').innerText = `$${Math.round(income).toLocaleString()}`;
            if(document.getElementById('dash-pending')) document.getElementById('dash-pending').innerText = `$${Math.round(pending).toLocaleString()}`;
            if(document.getElementById('dash-repair-cost')) document.getElementById('dash-repair-cost').innerText = `$${Math.round(repairCost).toLocaleString()}`;
            if(document.getElementById('dash-elec-profit')) document.getElementById('dash-elec-profit').innerText = `$${Math.round(totalElecProfit).toLocaleString()}`;
            if(document.getElementById('dash-water-profit')) document.getElementById('dash-water-profit').innerText = `$${Math.round(totalWaterProfit).toLocaleString()}`;
            if(document.getElementById('dash-net')) document.getElementById('dash-net').innerText = `$${Math.round(net).toLocaleString()}`;

            // Meter Reminders
            const today = new Date(); today.setHours(0,0,0,0);
            const meterReminders = window.state.rooms.filter(r => {
                if(!r.tenant || !r.paymentDay) return false;
                const pDay = parseInt(r.paymentDay);
                let nextPayDate = new Date(today.getFullYear(), today.getMonth(), pDay);
                if (nextPayDate < today) nextPayDate.setMonth(nextPayDate.getMonth() + 1);
                const diffTime = nextPayDate - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                return diffDays <= 5 && diffDays >= 0;
            });
            const meterContainer = document.getElementById('dashboard-meter-container');
            if (meterContainer) {
                if (meterReminders.length > 0) {
                    meterContainer.classList.remove('hidden');
                    document.getElementById('dashboard-meter-list').innerHTML = meterReminders.map(r => 
                        `<div class="bg-yellow-50 p-4 rounded-2xl border border-yellow-100 flex justify-between items-center"><div><div class="font-bold text-slate-800">${r.name} 房</div><div class="text-xs text-slate-500">繳費日：${r.paymentDay} 號</div></div><button onclick="window.showRoomDetail('${r.id}'); window.setTimeout(() => window.openBillFromDetail(), 300)" class="text-xs bg-yellow-400 text-white px-3 py-1.5 rounded-lg font-bold shadow-sm">抄表</button></div>`
                    ).join('');
                } else { meterContainer.classList.add('hidden'); }
            }

            // Bill List
            const list = document.getElementById('dashboard-bills-list');
            const unpaidRecs = window.state.records.filter(r => !r.paid);
            if(list) {
                if(unpaidRecs.length === 0) list.innerHTML = `<div class="text-center py-10 text-slate-300 font-bold text-sm">無待收帳單 🎉</div>`;
                else { list.innerHTML = unpaidRecs.map(r => `<div class="card p-5 flex justify-between items-center mb-3"><div><div class="text-lg font-bold text-slate-800">${r.roomName}</div><div class="text-xs text-slate-400">${r.billingMonth}</div></div><div class="text-right"><div class="text-xl font-black text-pink-500">$${Math.round(r.total)}</div><div class="text-[10px] text-slate-300">未繳</div></div></div>`).join(''); }
            }
        };

        window.renderFinance = function() {
            const container = document.getElementById('finance-list');
            const emptyMsg = document.getElementById('empty-finance-msg');
            const paidRecs = window.state.records.filter(r => r.paid);
            
            const yearlyData = {};
            const currentYear = new Date().getFullYear();
            paidRecs.forEach(r => {
                const y = (r.billingMonth || r.date).split('-')[0].split('/')[0];
                if(!yearlyData[y]) yearlyData[y] = { income: 0, cost: 0 };
                const eCostRate = r.elecCostRate !== undefined ? r.elecCostRate : (window.state.settings.elecCostRate || 2.1);
                const wCost = r.waterCost !== undefined ? r.waterCost : (window.state.settings.waterCostRate || 50);
                const elecCostTotal = (Number(r.usage) || 0) * eCostRate;
                yearlyData[y].income += Number(r.total) || 0;
                yearlyData[y].cost += (elecCostTotal + wCost);
            });
            window.state.repairs.forEach(r => {
                if(r.cost && r.date) {
                    const y = r.date.split('/')[0];
                    if(yearlyData[y]) yearlyData[y].cost += Number(r.cost);
                    else yearlyData[y] = { income: 0, cost: Number(r.cost) };
                }
            });
            const yStat = yearlyData[currentYear] || { income: 0, cost: 0 };
            const yNet = yStat.income - yStat.cost;
            
            document.getElementById('yearly-summary-container').innerHTML = `
                <div class="card p-6 bg-slate-800 text-white border-none shadow-xl">
                    <div class="flex justify-between items-center mb-4"><h3 class="text-lg font-bold">${currentYear} 年度總結</h3></div>
                    <div class="grid grid-cols-3 gap-2 text-center">
                        <div><div class="text-xs text-slate-400 mb-1">總收</div><div class="text-lg font-bold">$${Math.round(yStat.income).toLocaleString()}</div></div>
                        <div><div class="text-xs text-slate-400 mb-1">總支</div><div class="text-lg font-bold text-red-400">$${Math.round(yStat.cost).toLocaleString()}</div></div>
                        <div><div class="text-xs text-slate-400 mb-1">淨利</div><div class="text-lg font-bold text-green-400">$${Math.round(yNet).toLocaleString()}</div></div>
                    </div>
                </div>`;

            if(paidRecs.length === 0) { 
                container.innerHTML = ''; 
                emptyMsg.classList.remove('hidden'); 
                return; 
            }
            emptyMsg.classList.add('hidden');
            
            window.tempMonthlyData = {}; 
            const grouped = {}; 
            paidRecs.forEach(r => {
                const monthKey = r.billingMonth || r.date.split('/')[0] + '-' + r.date.split('/')[1];
                if(!grouped[monthKey]) grouped[monthKey] = { income: 0, cost: 0, utilityCost: 0, repairCost: 0, items: [] };
                
                const eCostRate = r.elecCostRate !== undefined ? r.elecCostRate : (window.state.settings.elecCostRate || 2.1);
                const wCost = r.waterCost !== undefined ? r.waterCost : (window.state.settings.waterCostRate || 50);
                const elecCostTotal = (Number(r.usage) || 0) * eCostRate;
                const currentUtility = elecCostTotal + wCost;

                grouped[monthKey].income += Number(r.total) || 0;
                grouped[monthKey].cost += currentUtility;
                grouped[monthKey].utilityCost += currentUtility;
                grouped[monthKey].items.push(r);
            });
            
            window.state.repairs.forEach(r => {
                if(r.cost && r.date) {
                    const parts = r.date.split('/');
                    const monthKey = parts[0] + '-' + parts[1]; 
                    if(!grouped[monthKey]) grouped[monthKey] = { income: 0, cost: 0, utilityCost: 0, repairCost: 0, items: [] };
                    grouped[monthKey].cost += Number(r.cost);
                    grouped[monthKey].repairCost += Number(r.cost);
                }
            });

            window.tempMonthlyData = grouped;
            container.innerHTML = Object.keys(grouped).sort((a,b)=>b.localeCompare(a)).map(month => {
                const d = grouped[month]; const net = d.income - d.cost;
                return `<div class="card p-5 flex justify-between items-center cursor-pointer mb-3" onclick='window.openMonthDetail("${month}")'><div><div class="text-lg font-bold text-slate-800">${month}</div><div class="text-xs text-slate-400">營收 $${d.income}</div></div><div class="text-right"><div class="text-lg font-bold text-green-600">+$${Math.round(net).toLocaleString()}</div><div class="text-[10px] text-slate-300">淨利</div></div></div>`;
            }).join('');
        };
        
        window.openMonthDetail = function(month) {
            const data = window.tempMonthlyData[month]; if(!data) return;
            document.getElementById('fin-detail-month').innerText = month;
            const net = data.income - data.cost;
            document.getElementById('fin-detail-income').innerText = `$${Math.round(data.income).toLocaleString()}`;
            document.getElementById('fin-detail-cost').innerText = `-$${Math.round(data.cost).toLocaleString()}`;
            document.getElementById('fin-detail-net').innerText = `$${Math.round(net).toLocaleString()}`;
            
            const total = data.income || 1; 
            const profitPct = Math.max(0, (net / total) * 100);
            const utilityPct = (data.utilityCost / total) * 100;
            const stop1 = profitPct;
            const stop2 = profitPct + utilityPct;
            const chart = document.getElementById('pie-chart');
            chart.style.background = `conic-gradient(#10b981 0% ${stop1}%, #3b82f6 ${stop1}% ${stop2}%, #f97316 ${stop2}% 100%)`;
            
            const list = document.getElementById('fin-detail-list');
            list.innerHTML = data.items.map(r => `<div class="flex justify-between items-center py-2 border-b border-slate-100 last:border-0"><span class="font-bold text-slate-700">${r.roomName}</span><span class="font-black text-blue-600">$${r.total}</span></div>`).join('');
            document.getElementById('modal-finance-detail').classList.remove('hidden');
        };

        window.saveLoginState = function() { localStorage.setItem('rental_login_attempts', JSON.stringify(window.state.loginAttempts)); localStorage.setItem('rental_lockout_until', JSON.stringify(window.state.lockoutUntil)); };
        window.setFontSize = function(size) { window.state.settings.fontSize = size; document.documentElement.style.setProperty('--base-font-size', size + 'px'); document.querySelectorAll('.font-size-btn').forEach(btn => btn.classList.remove('active')); const activeBtn = document.getElementById('font-size-' + size); if(activeBtn) activeBtn.classList.add('active'); window.saveData(); };
        window.switchView = function(view) { document.querySelectorAll('.view-section').forEach(el => el.classList.add('hidden')); const t = document.getElementById(`view-${view}`) || document.getElementById(`app-${view.split('-')[0]}`); if(t) t.classList.remove('hidden'); };
        window.switchTab = function(tab) { document.querySelectorAll('.landlord-tab').forEach(el => el.classList.add('hidden')); document.getElementById(`tab-${tab}`).classList.remove('hidden'); document.querySelectorAll('.nav-btn').forEach(btn => { btn.classList.remove('text-slate-800'); btn.classList.add('text-slate-400'); }); document.getElementById(`btn-${tab}`).classList.remove('text-slate-400'); document.getElementById(`btn-${tab}`).classList.add('text-slate-800'); if(tab==='finance') window.renderFinance(); };
        window.checkLockout = function(type) { const now = Date.now(); if (window.state.lockoutUntil[type] > now) { alert(`請等待 ${Math.ceil((window.state.lockoutUntil[type] - now) / 1000)} 秒`); return true; } return false; };
        window.verifyOwner = function() { if(window.checkLockout('owner')) return; const pwd = document.getElementById('owner-pwd-input').value; if (pwd === window.state.settings.password) { window.state.loginAttempts.owner = 0; saveLoginState(); switchView('landlord'); switchTab('dashboard'); } else { window.state.loginAttempts.owner++; if(window.state.loginAttempts.owner >= 5) window.state.lockoutUntil.owner = Date.now() + 300000; alert('密碼錯誤'); saveLoginState(); } };
        window.tenantLogin = function() { if(window.checkLockout('tenant')) return; const p=document.getElementById('tenant-phone-input').value; const r=window.state.rooms.find(x=>x.phone===p); if(r){ window.state.loginAttempts.tenant = 0; saveLoginState(); window.currentTenantRoom=r; switchView('tenant'); } else { window.state.loginAttempts.tenant++; if(window.state.loginAttempts.tenant >= 5) window.state.lockoutUntil.tenant = Date.now() + 300000; alert('查無此號碼'); saveLoginState(); } };
        window.saveRoom = async function() { const btn=document.getElementById('btn-save-room'); if(btn.disabled) return; btn.disabled=true; btn.innerText="處理中..."; try{ const idVal=document.getElementById('edit-room-id').value; const id=idVal?idVal:Date.now().toString(); const rd={id, name:document.getElementById('edit-name').value, rent:Number(document.getElementById('edit-rent').value), tenant:document.getElementById('edit-tenant').value, phone:document.getElementById('edit-phone').value, paymentDay:document.getElementById('edit-payday').value, start:document.getElementById('edit-start').value, end:document.getElementById('edit-end').value, meter:Number(document.getElementById('edit-meter').value), waterFee:Number(document.getElementById('edit-water-fee').value), mgmtFee:Number(document.getElementById('edit-mgmt').value), photo:document.getElementById('edit-preview-main').src, furnPhotos: window.tempEditPhotos.furn, contPhotos: window.tempEditPhotos.cont, photoFurn: null, photoCont: null}; if(!rd.name){alert('房號?');return;} const idx=window.state.rooms.findIndex(x=>x.id==id); if(idx>-1) window.state.rooms[idx]=rd; else window.state.rooms.push(rd); window.saveData(); await window.syncToCloud('rooms',id,rd); window.closeModal('modal-room-edit'); }catch(e){alert('Err');}finally{btn.disabled=false;btn.innerText="儲存";} };
        window.deleteRoom = function() { if(confirm('刪除？')){ const id=document.getElementById('edit-room-id').value; window.state.rooms=window.state.rooms.filter(x=>x.id!=id); window.saveData(); window.deleteFromCloud('rooms',id); window.closeModal('modal-room-edit'); } };
        window.moveOutTenant = function() { if(confirm('退租？')){ const id=document.getElementById('edit-room-id').value; const r=window.state.rooms.find(x=>x.id==id); r.tenant=""; r.phone=""; r.start=""; r.end=""; r.contPhotos=[]; window.saveData(); window.syncToCloud('rooms',id,r); window.closeModal('modal-room-edit'); } };
        window.handleAddPhoto = function(input, type) { if(input.files[0]) { window.compressImage(input.files[0], (base64) => { window.tempEditPhotos[type].push(base64); window.renderEditPhotoList(type); input.value = ''; }); } };
        window.renderEditPhotoList = function(type) { const container = document.getElementById(`edit-list-${type}`); const list = window.tempEditPhotos[type]; container.innerHTML = list.map((src, index) => `<div class="photo-item"><img src="${src}"><div class="photo-del" onclick="window.removeEditPhoto('${type}', ${index})"><i class="fa-solid fa-xmark"></i></div></div>`).join(''); };
        window.removeEditPhoto = function(type, index) { window.tempEditPhotos[type].splice(index, 1); window.renderEditPhotoList(type); };
        window.viewBigImage = function(src) { document.getElementById('lightbox-img').src = src; document.getElementById('modal-lightbox').classList.remove('hidden'); };
        window.triggerFile = function(id) { document.getElementById(id).click(); };
        window.handlePhoto = function(input, id) { if(input.files[0]) { window.compressImage(input.files[0], (base64) => { const img=document.getElementById(id); img.src=base64; img.classList.remove('hidden'); }); } };
        window.compressImage = function(file, callback) { const reader = new FileReader(); reader.readAsDataURL(file); reader.onload = event => { const img = new Image(); img.src = event.target.result; img.onload = () => { const canvas = document.createElement('canvas'); const MAX_WIDTH = 600; const scaleSize = MAX_WIDTH / img.width; if (scaleSize >= 1) { canvas.width = img.width; canvas.height = img.height; } else { canvas.width = MAX_WIDTH; canvas.height = img.height * scaleSize; } const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, canvas.width, canvas.height); callback(canvas.toDataURL('image/jpeg', 0.5)); } } };
        window.openBillFromDetail = function() { window.closeModal('modal-room-detail'); window.openBillModal(window.currentRoomId); };
        window.openBillModal = function(id) { const r=window.state.rooms.find(x=>x.id==id); window.currentBillRoomId=id; document.getElementById('bill-last').innerText=r.meter; document.getElementById('bill-curr').value=""; document.getElementById('bill-elec-rate').value=3.5; document.getElementById('bill-elec-cost-rate').value=window.state.settings.elecCostRate||2.1; document.getElementById('bill-water-fee').value=0; document.getElementById('bill-water-cost').value=window.state.settings.waterCostRate||50; document.getElementById('bill-mgmt').value=r.mgmtFee||0; const now=new Date(); document.getElementById('bill-month').value=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,'0'); document.getElementById('modal-bill').classList.remove('hidden'); };
        window.createBill = function() { const r=window.state.rooms.find(x=>x.id==window.currentBillRoomId); const c=Number(document.getElementById('bill-curr').value); const m=document.getElementById('bill-month').value; const er=3.5; const wf=0; const mf=Number(document.getElementById('bill-mgmt').value); const eCostRate = Number(document.getElementById('bill-elec-cost-rate').value); const wCost = Number(document.getElementById('bill-water-cost').value); if(!c)return alert('度數?'); if(!m)return alert('月份?'); const u=c-(r.meter||0); const e=u*er; const t=parseInt(r.rent)+e+wf+mf; const rec={id:Date.now().toString(), roomId:r.id, roomName:r.name, tenant:r.tenant, total:t, paid:false, date:new Date().toLocaleDateString('zh-TW'), billingMonth:m, elecCost:e, waterFee:wf, rent:r.rent, usage:u, elecCostRate: eCostRate, waterCost: wCost}; r.meter=c; window.state.records.unshift(rec); window.saveData(); window.syncToCloud('rooms',r.id,r); window.syncToCloud('records',rec.id,rec); window.closeModal('modal-bill'); window.showToast('生成'); };
        window.saveSettings = function() { window.state.settings.elecRate=Number(document.getElementById('set-elec').value); window.state.settings.elecCostRate=Number(document.getElementById('set-elec-cost').value); window.state.settings.waterRate=Number(document.getElementById('set-water').value); window.state.settings.waterCostRate=Number(document.getElementById('set-water-cost').value); window.state.settings.bankAccount=document.getElementById('set-bank').value; window.state.settings.password=document.getElementById('set-pwd').value; const pidInput = document.getElementById('set-project-id').value; if(pidInput) window.state.settings.projectId = pidInput; window.saveData(); };
        
        window.initCloud = async function() {
            const statusEl = document.getElementById('status-indicator');
            const settingsStatusEl = document.getElementById('cloud-status-text');
            const authStatusEl = document.getElementById('auth-status');
            if(typeof firebase !== 'undefined') {
                try {
                    if (!firebase.apps.length) firebase.initializeApp(window.userFirebaseConfig);
                    const auth = firebase.auth();
                    try { await auth.signInAnonymously(); if(authStatusEl) { authStatusEl.innerText = "已驗證 (匿名)"; authStatusEl.className = "text-green-500 font-bold"; } } catch(e) { console.error(e); }
                    window.db = firebase.firestore();
                    window.db.collection('rooms').onSnapshot((snap) => { if (!snap.empty && !snap.metadata.hasPendingWrites) { const cloudRooms = snap.docs.map(d => d.data()); if (JSON.stringify(window.state.rooms) !== JSON.stringify(cloudRooms)) { window.state.rooms = cloudRooms; localStorage.setItem('rental_rooms', JSON.stringify(window.state.rooms)); window.renderRooms(); window.renderDashboard(); if(!document.getElementById('tab-finance').classList.contains('hidden')) window.renderFinance(); } } statusEl.innerHTML = '<i class="fa-solid fa-cloud mr-1"></i> 已連線'; statusEl.className = "text-[10px] font-bold bg-green-100 text-green-600 px-3 py-1 rounded-full cursor-pointer"; if(settingsStatusEl) { settingsStatusEl.innerHTML = '<i class="fa-solid fa-check-circle text-green-500"></i> 雲端連線正常'; settingsStatusEl.className = "text-center text-xs font-bold text-green-600 mb-3"; } });
                    window.db.collection('records').onSnapshot(snap => { if (!snap.empty && !snap.metadata.hasPendingWrites) { window.state.records = snap.docs.map(d => d.data()); window.renderDashboard(); if(!document.getElementById('tab-finance').classList.contains('hidden')) window.renderFinance(); } });
                    window.db.collection('repairs').onSnapshot(snap => { if (!snap.empty && !snap.metadata.hasPendingWrites) { window.state.repairs = snap.docs.map(d => d.data()); window.renderDashboard(); } });
                } catch(e) { console.error(e); statusEl.innerText = "連線錯誤"; }
            }
        };
        
        window.syncToCloud = async function(coll, id, data) { if(window.db) { try { await window.db.collection(coll).doc(String(id)).set(data); } catch (e) { console.error(e); } } };
        window.checkCloudStatus = async function() { if(!window.db) return alert("❌ 未連線"); try { await window.db.collection('rooms').limit(1).get(); alert(`✅ 連線正常`); } catch(e) { alert("❌ 失敗：" + e.message); } };
        window.forceUploadAllLocalData = async function() { if(!window.db) return alert("❌ 未連線"); if(!confirm("確定上傳？")) return; try { for (const r of window.state.rooms) { await window.syncToCloud('rooms', r.id, r); } for (const r of window.state.records) { await window.syncToCloud('records', r.id, r); } for (const r of window.state.repairs) { await window.syncToCloud('repairs', r.id, r); } alert(`✅ 上傳成功`); } catch(e) { alert("❌ 錯誤：" + e.message); } };
        window.forceDownloadCloudData = async function() { if(!window.db) return alert("❌ 未連線"); if(!confirm("確定下載並覆蓋？")) return; try { const snap = await window.db.collection('rooms').get(); if(snap.empty) return alert("無資料"); window.state.rooms = snap.docs.map(d => d.data()); localStorage.setItem('rental_rooms', JSON.stringify(window.state.rooms)); const snapRec = await window.db.collection('records').get(); window.state.records = snapRec.docs.map(d => d.data()); localStorage.setItem('rental_records', JSON.stringify(window.state.records)); const snapRep = await window.db.collection('repairs').get(); window.state.repairs = snapRep.docs.map(d => d.data()); localStorage.setItem('rental_repairs', JSON.stringify(window.state.repairs)); alert("✅ 下載成功"); window.location.reload(); } catch(e) { alert("失敗：" + e.message); } };
        window.deleteFromCloud = async function(coll, id) { if(window.db) try { await window.db.collection(coll).doc(String(id)).delete(); } catch(e) {} };
        window.exportData = function() { const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(window.state)); const downloadAnchorNode = document.createElement('a'); downloadAnchorNode.setAttribute("href", dataStr); downloadAnchorNode.setAttribute("download", "rental_manager_backup_" + new Date().toISOString() + ".json"); document.body.appendChild(downloadAnchorNode); downloadAnchorNode.click(); downloadAnchorNode.remove(); };
        window.closeModal = function(id) { document.getElementById(id).classList.add('hidden'); };
        window.showToast = function(m) { const t=document.getElementById('toast'); document.getElementById('toast-msg').innerText=m; t.classList.remove('hidden','opacity-0'); setTimeout(()=>{t.classList.add('opacity-0','hidden')},2000); };
        window.clearCacheAndReload = function() { if(confirm("確定清除暫存？")) { localStorage.clear(); window.location.reload(); } };

        // Explicit Global Binding
        Object.assign(window, {
            saveLoginState, setFontSize, switchView, switchTab, checkLockout, verifyOwner, tenantLogin,
            renderTenantDashboard, handleTenantRepairPhotos, submitTenantRepair, confirmExit, saveData,
            initCloud, syncToCloud, checkCloudStatus, forceUploadAllLocalData, forceDownloadCloudData,
            deleteFromCloud, renderRooms, renderDashboard, renderFinance, applySettingsUI, saveSettings,
            showRoomDetail, openRoomModal, openEditRoom, saveRoom, deleteRoom, moveOutTenant,
            handleAddPhoto, renderEditPhotoList, removeEditPhoto, viewBigImage, triggerFile, handlePhoto, compressImage,
            openBillFromDetail, openBillModal, createBill, openPayModal, confirmPay, openNotifyModal,
            copyNotify, markNotified, openRepairProcess, saveRepairProcess, analyzeRepair, openMonthDetail,
            exportData, closeModal, showToast, clearCacheAndReload
        });
        
        window.onload = function() {
            try {
                document.getElementById('landing-id').innerText = window.state.settings.projectId;
                window.setFontSize(window.state.settings.fontSize || 16);
                window.applySettingsUI();
                window.initCloud();
            } catch (e) {
                console.error("Init Error:", e);
            }
        };
    </script>
</body>
</html>
